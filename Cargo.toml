[package]
name = "mcp-web"
version = "0.1.0"
edition = "2024"
description = "Model Context Protocol (MCP) server for web search (Google + DuckDuckGo fallback) and token-efficient SPA-capable web-to-Markdown fetching"
license = "MIT"

[[bin]]
name = "mcp-web"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
chromiumoxide = { version = "0.9.1", default-features = false }
clap = { version = "4.5", features = ["derive", "env"] }
fastrand = "2.3"
futures = "0.3"
htmd = "0.5"
moka = { version = "0.12", features = ["future"] }
once_cell = "1.21"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "brotli", "deflate", "rustls-tls"] }
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
urlencoding = "2.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
http-body-util = "0.1"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
